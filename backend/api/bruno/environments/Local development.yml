name: Local development
variables:
  - name: baseUrl
    value: http://localhost:3000
  # Seeded tenants (see docker/postgres init / README). Used as the x-tenant-id
  # header so RLS scopes each request to one tenant.
  - name: tenantAlpha
    value: 11111111-1111-1111-1111-111111111111
  - name: tenantBeta
    value: 22222222-2222-2222-2222-222222222222
  # Populated by the "Login" request's post-response script; used as the Bearer
  # token on protected requests.
  - name: token
    value: ""
