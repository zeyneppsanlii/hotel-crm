info:
  name: Login
  type: http
  seq: 1
  tags:
    - auth

# Login is tenant-scoped: the x-tenant-id header picks which hotel you sign into.
# The seed (npx prisma db seed) creates admin@alpha.com / staff@alpha.com /
# admin@beta.com, all with password "admin1234".
http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@alpha.com",
        "password": "admin1234"
      }
  auth: inherit
  headers:
    - name: x-tenant-id
      value: "{{tenantAlpha}}"

# Capture the returned tokens into env vars so protected requests can use
# {{token}}, and Refresh/Logout can use {{refreshToken}}.
scripts:
  postResponse: |-
    if (res.getStatus() === 200) {
      // Responses are wrapped in the standard envelope: { success, data, meta }.
      bru.setEnvVar('token', res.getBody().data.accessToken);
      bru.setEnvVar('refreshToken', res.getBody().data.refreshToken);
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
