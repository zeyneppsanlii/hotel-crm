info:
  name: List users
  type: http
  seq: 1
  tags:
    - users

http:
  method: GET
  url: "{{baseUrl}}/users"
  auth: inherit
  headers:
    # RLS scopes the result to this tenant. Without it the request is rejected 400.
    - name: x-tenant-id
      value: "{{tenantAlpha}}"
    # Requires an authenticated user with users:manage (admin/manager). Run Login first.
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: List of users (scoped to the tenant in x-tenant-id)
    request:
      url: "{{baseUrl}}/users"
      method: GET
      headers:
        - name: x-tenant-id
          value: "{{tenantAlpha}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "tenantId": "",
              "email": "",
              "name": "",
              "createdAt": "",
              "updatedAt": ""
            }
          ]
