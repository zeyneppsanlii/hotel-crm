info:
  name: List users
  type: http
  seq: 1
  tags:
    - users

http:
  method: GET
  url: "{{baseUrl}}/users?page=1&limit=20"
  auth: inherit
  headers:
    # RLS scopes the result to this tenant. Without it the request is rejected 400.
    - name: x-tenant-id
      value: "{{tenantAlpha}}"
    # Requires an authenticated user with users:manage (admin/manager). Run Login first.
    - name: Authorization
      value: "Bearer {{token}}"

# Capture the first row's id so "Get a user" / "Update a user" work straight after.
scripts:
  postResponse: |-
    if (res.getStatus() === 200 && res.getBody().data.length > 0) {
      bru.setEnvVar('userId', res.getBody().data[0].id);
    }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: >-
      One page of users, scoped to the tenant in x-tenant-id. page/limit/total/
      hasMore live in meta; limit defaults to 20 and is capped at 100.
    request:
      url: "{{baseUrl}}/users?page=1&limit=20"
      method: GET
      headers:
        - name: x-tenant-id
          value: "{{tenantAlpha}}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "data": [
              {
                "id": "",
                "tenantId": "",
                "email": "",
                "fullName": "",
                "role": "staff",
                "permissions": [],
                "phone": null,
                "isActive": true,
                "lastLoginAt": null,
                "createdAt": "",
                "updatedAt": ""
              }
            ],
            "meta": {
              "timestamp": "",
              "requestId": "",
              "page": 1,
              "limit": 20,
              "total": 1,
              "hasMore": false
            }
          }
