info:
  name: Create a user
  type: http
  seq: 3
  tags:
    - users

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "email": "alice@alpha.com",
        "name": "Alice"
      }
  auth: inherit
  headers:
    # The created user is stamped with this tenant id (RLS filters, the app stamps).
    - name: x-tenant-id
      value: "{{tenantAlpha}}"
    # Requires an authenticated user with users:manage (admin/manager). Run Login first.
    - name: Authorization
      value: "Bearer {{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: User created
    request:
      url: "{{baseUrl}}/users"
      method: POST
      headers:
        - name: x-tenant-id
          value: "{{tenantAlpha}}"
      body:
        type: json
        data: |-
          {
            "email": "alice@alpha.com",
            "name": "Alice"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "tenantId": "",
            "email": "",
            "name": "",
            "createdAt": "",
            "updatedAt": ""
          }
