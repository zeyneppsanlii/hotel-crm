name: CI

on:
  push:
    branches: [master, staging, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hotelcrm
          POSTGRES_PASSWORD: hotelcrm_dev_2026
          POSTGRES_DB: hotel_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotelcrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate

      - run: npm run lint
      - run: npm run build
      - run: npm test
      # e2e provisions the app role + migrations + RLS on hotel_crm_test itself
      # (see test/setup/global-setup.ts), then runs against the service Postgres.
      - run: npm run test:e2e
