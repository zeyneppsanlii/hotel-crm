services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelcrm
      POSTGRES_PASSWORD: hotelcrm_dev_2026
      POSTGRES_DB: hotel_crm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions the non-superuser `hotelcrm_app` role on a fresh volume.
      # Runs only on first init; see the script header for existing volumes.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    container_name: hotel_crm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: